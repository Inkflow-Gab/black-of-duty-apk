name: Build APK

# WHY THIS IS A SEPARATE REPOSITORY
#
# The APK is a build artefact, not source. Keeping it in the game repo would mean
# two sources of truth for the same code and a commit that changes both the game
# and its wrapper. Here, the wrapper is built against the game repository as an
# external input: one source of truth, and the APK can only ever lag or match it.
#
# This repo contains no game code at all. It is the wrapper, the patches applied
# to the generated Android project, and this workflow.

on:
  # The game moved, so the APK is out of date. Rebuilding on every game commit
  # would burn minutes of CI for a change that is often a comment.
  workflow_dispatch:
    inputs:
      ref:
        description: Game branch or commit to wrap
        required: false
        default: main
  push:
    paths:
      - 'capacitor.config.ts'
      - 'android-overrides/**'
      - '.github/workflows/build-apk.yml'
      - 'build-apk.sh'

permissions:
  contents: read

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # The game. Public repository, so no token is needed and this workflow
      # cannot write to it — it only ever reads.
      - name: Check out the game
        run: |
          git clone --depth 1 --branch "${{ github.event.inputs.ref || 'main' }}" \
            https://github.com/Inkflow-Gab/Claude-of-Duty.git game
          echo "game commit: $(git -C game rev-parse --short HEAD)"

      - name: Build the game
        working-directory: game
        run: |
          npm ci
          # The game builds with a subpath base for GitHub Pages. Inside an APK the
          # assets are served from the APK's own origin at the root, so BASE_PATH
          # must be '/' or every asset request 404s and the app shows the boot
          # failure panel instead of the game.
          BASE_PATH: '/' NODE_ENV=production npx vite build
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }

      - name: Report what we wrapped
        run: |
          cd game
          echo "bundle: $(du -h dist/assets/*.js | tail -1)"
          echo "files:  $(find dist -type f | wc -l)"

      # The Android toolchain is pre-installed on ubuntu-latest: JDK 17, the
      # Android SDK, and a Gradle cache. The development sandbox could not do
      # this — it has no SDK at all — which is the entire reason this build runs
      # here rather than locally.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate the Android project and apply our patches
        run: |
          ./build-apk.sh

      - name: Build the debug APK
        working-directory: android
        run: |
          # A debug build is signed with the SDK's auto-generated debug keystore,
          # so it installs on a real device. A release build needs a signing key
          # that must not live in a repository, which is why this does not attempt
          # one.
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate the APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          test -n "$APK" || { echo "no APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$APK" | cut -f1)"
          ls -la "$APK"

      # An APK nobody can get hold of is not a build. The artefact is the
      # deliverable — it is downloadable from the Actions run for 90 days, and a
      # tagged release makes it permanent.
      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: black-of-duty-debug-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### APK built"
            echo
            echo "- game commit: \`$(git -C game rev-parse --short HEAD)\`"
            echo "- apk: \`${{ steps.apk.outputs.path }}\` (${{ steps.apk.outputs.size }})"
            echo
            echo "Download it from the Artifacts section of this run."
          } >> "$GITHUB_STEP_SUMMARY"
